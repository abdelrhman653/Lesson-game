<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة الألعاب الذكية 🎮</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 { color: #0984e3; font-size: 22px; }
        .btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
            margin: 10px 0;
            width: 100%;
            font-weight: bold;
        }
        .btn:active { transform: scale(0.98); }
        #cameraInput { display: none; }
        
        /* مكان عرض الصور المتعددة */
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .preview-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #0984e3;
        }

        .output-box {
            background: #dfe6e9;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: right;
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            white-space: pre-wrap;
        }
        .loading { color: #e17055; font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌟 معلمتي الذكية 🌟</h1>
        <p>صوري صفحات الدرس كلها يا بطلة، وتعالي نلعب ونتعلم سوا! 📚✨</p>

        <!-- زرار لاختيار أو تصوير أكثر من صفحة -->
        <label for="cameraInput" class="btn">📸 صوري صفحات الدرس (اختر صور متعددة)</label>
        <input type="file" id="cameraInput" accept="image/*" multiple>

        <!-- عرض الصور المصغرة -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="loading" id="loadingText">⏳ ثواني يا بطلة، جاري قراءة كل الصفحات وتحويلها للعبة وشرح...</div>

        <!-- مكان ظهور الشرح واللعبة -->
        <div class="output-box" id="outputResult">
            هنا هيظهر الشرح الملخص والأسئلة بصوت جميل! 🎮
        </div>

        <button class="btn" id="speakBtn" style="background: #0984e3; display: none;" onclick="speakResult()">🔊 اسمعي الشرح تاني</button>
    </div>

    <script>
        const apiKey = "حط_مفتاح_الـ_API_هنا"; // حط مفتاح الجيميني API الصحيح هنا
        let currentTextToSpeech = "";
        let collectedImages = [];

        document.getElementById('cameraInput').addEventListener('change', async function(event) {
            const files = event.target.files;
            if (!files.length) return;

            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            collectedImages = [];

            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('outputResult').innerText = "جاري تجهيز الصور...";
            document.getElementById('speakBtn').style.display = 'none';

            // تحويل كل الصور المرفوعة لـ Base64
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // عرض الصورة المصغرة
                const imgThumb = document.createElement('img');
                imgThumb.src = URL.createObjectURL(file);
                imgThumb.className = 'preview-img';
                previewContainer.appendChild(imgThumb);

                // تحويل لـ Base64
                const base64 = await toBase64(file);
                collectedImages.push({
                    inline_data: {
                        mime_type: file.type || "image/jpeg",
                        data: base64
                    }
                });
            }

            // بعد ما نخلص تجهيز كل الصور، نبعتها للذكاء الاصطناعي
            await analyzeImagesWithGemini();
        });

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function analyzeImagesWithGemini() {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const promptText = "أنت معلمة كرتونية ومرحة جداً للأطفال. انظر إلى صور صفحات الدرس هذه، واقرأها جيداً. لخص الدرس كله في شكل قصة قصيرة وممتعة، وبعدين اعمل لها لعبة 'سؤال وشرط' أو أسئلة خفيفة ومسلية عشان تختبر فهم الطفلة. اتكلم باللهجة المصرية البسيطة والودودة، وبدون إيموجي مفرطة.";

            // تجهيز الطلب بكل الصور ومعاها البرومفت
            const parts = [{ text: promptText }, ...collectedImages];

            const requestBody = {
                contents: [{ parts: parts }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const textResult = data.candidates[0].content.parts[0].text;
                    document.getElementById('loadingText').style.display = 'none';
                    document.getElementById('outputResult').innerText = textResult;
                    currentTextToSpeech = textResult;
                    document.getElementById('speakBtn').style.display = 'block';

                    // تشغيل الصوت تلقائي
                    speakResult();
                } else {
                    throw new Error("استجابة غير صالحة من السيرفر");
                }

            } catch (error) {
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('outputResult').innerText = "حصلت مشكلة في الاتصال أو مفتاح الـ API غير صحيح، تأكد من المفتاح يا بطل!";
                console.error(error);
            }
        }

        function speakResult() {
            if (!currentTextToSpeech) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentTextToSpeech);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
