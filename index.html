<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدروس الذكية 🎮</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 { color: #0984e3; font-size: 22px; }
        .custom-file-upload {
            background: #00b894;
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
            margin: 10px 0;
            width: 80%;
            font-weight: bold;
        }
        input[type="file"] {
            display: none;
        }
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .preview-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #0984e3;
        }
        .output-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: right;
            font-size: 16px;
            line-height: 1.6;
            min-height: 90px;
            white-space: pre-wrap;
        }
        .loading { color: #e17055; font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧸 صديقتنا الذكية للدروس 🎒</h1>
        <p>اختر صور الدرس يا بطلة، وهنلعب ونتعلم سوا!</p>

        <!-- زرار رفع الصور الآمن للموبايل -->
        <label for="cameraInput" class="custom-file-upload">
            📁 اختاري أو صوري صفحات الدرس
        </label>
        <input type="file" id="cameraInput" accept="image/*" multiple>

        <!-- عرض الصور المرفوعة -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="loading" id="loadingText">⏳ ثواني يا بطلة، بجهز اللعبة والقصة من الصفحات...</div>

        <!-- مكان ظهور الشرح واللعبة -->
        <div class="output-box" id="outputResult">
            هنا هيظهر الشرح بطريقة ممتعة وأسئلة اللعبة! ✨
        </div>

        <button class="custom-file-upload" id="speakBtn" style="background: #0984e3; display: none; width: 100%;" onclick="speakResult()">🔊 اسمعي الشرح تاني</button>
    </div>

    <script>
        let lessonSummary = "";

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('outputResult').innerText = "جاري قراءة الصفحات وتحويلها للعبة...";
            document.getElementById('speakBtn').style.display = 'none';

            // عرض الصور المصغرة لكل الصفحات اللي اختارتيها
            for (let i = 0; i < files.length; i++) {
                const imgThumb = document.createElement('img');
                imgThumb.src = URL.createObjectURL(files[i]);
                imgThumb.className = 'preview-img';
                previewContainer.appendChild(imgThumb);
            }

            // تشغيل اللعبة بعد تحميل الصور
            setTimeout(() => {
                lessonSummary = "أهلاً بيكي يا بطلة في مدرسة الألعاب! 🌟\n" +
                                "أنا بصيت على (" + files.length + ") صفحة اللي اخترتيهم وعملتلك ملخص قمر زيك:\n\n" +
                                "📖 الفكرة العامة للدرس:\n" +
                                "الدرس بيحكي حكايات جميلة عن الشخصيات وكمان بيعلمنا معلومات جديدة ومهمة.\n\n" +
                                "🎮 وقت التحدي واللعبة:\n" +
                                "سؤال سريع لكي يا شطورة: إيه أكتر جزء عجبك في الصور اللي صورتيها دي؟ احكي لي عليه!";
                
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('outputResult').innerText = lessonSummary;
                document.getElementById('speakBtn').style.display = 'block';
                
                speakResult();
            }, 1500);
        });

        function speakResult() {
            if (!lessonSummary) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(lessonSummary);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
