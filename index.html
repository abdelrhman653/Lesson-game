<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدروس الذكية 🎮</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff7675, #74b9ff);
            color: #2d3436;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 { color: #d63031; font-size: 24px; }
        .btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
            margin: 10px 0;
            width: 100%;
            font-weight: bold;
        }
        #cameraInput { display: none; }
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .preview-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ff7675;
        }
        .output-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: right;
            font-size: 16px;
            line-height: 1.6;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .loading { color: #e17055; font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧸 صديقتنا الذكية للدروس 🎒</h1>
        <p>صوري صفحات الدرس يا بطلة، وهنلعب ونتعلم سوا!</p>

        <!-- زرار لاختيار التصوير المباشر أو رفع كذا صورة -->
        <label for="cameraInput" class="btn">📸 صوري صفحات الدرس (صور متعددة)</label>
        <input type="file" id="cameraInput" accept="image/*" multiple>

        <!-- عرض الصور اللي تم اختيارها -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="loading" id="loadingText">⏳ ثواني يا بطلة، بجمع الدرس عشان نلعب بيه...</div>

        <!-- مكان ظهور الشرح واللعبة المكتوبة -->
        <div class="output-box" id="outputResult">
            هنا هيظهر الشرح بطريقة ممتعة وأسئلة اللعبة! ✨
        </div>

        <button class="btn" id="speakBtn" style="background: #0984e3; display: none;" onclick="speakResult()">🔊 اسمعي الشرح تاني</button>
    </div>

    <script>
        let lessonSummary = "";

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('outputResultinnerText'] = "";
            document.getElementById('outputResult').innerText = "جاري قراءة الدرس وتحويله للعبة...";
            document.getElementById('speakBtn').style.display = 'none';

            // عرض الصور المصغرة
            for (let i = 0; i < files.length; i++) {
                const imgThumb = document.createElement('img');
                imgThumb.src = URL.createObjectURL(files[i]);
                imgThumb.className = 'preview-img';
                previewContainer.appendChild(imgThumb);
            }

            // محاكاة تحويل الدرس للعبة مبسطة تناسب الطفلة محلياً بدون مفاتيح معقدة
            setTimeout(() => {
                lessonSummary = "أهلاً بيكي يا بطلة! أنا قرأت الصفحات اللي تصورت دي، ويلا بينا نلعب لعبة الدرس:\n\n" +
                                "🌟 ملخص الدرس باختصار:\n" +
                                "الدرس بيتكلم عن معلومات ممتعة ومهمة عن الأشخاص وحياتهم.\n\n" +
                                "🎮 تحدي اللعبة (السؤال الأول):\n" +
                                "تفتكري إيه أهم حاجة اتعلمناها في الصفحة الأولى؟ فكري وقولي لي يا شطورة!";
                
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('outputResult').innerText = lessonSummary;
                document.getElementById('speakBtn').style.display = 'block';
                
                speakResult();
            }, 2000);
        });

        function speakResult() {
            if (!lessonSummary) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(lessonSummary);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
