<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بطلة الدرس 🎮✨</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9ff3, #feca57);
            color: #2d3436;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        h1 { color: #ff6b6b; font-size: 24px; margin-bottom: 5px; }
        .score-box {
            background: #54a0ff;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-box {
            background: #f1f2f6;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .option-btn {
            background: #00d2d3;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .option-btn:active { transform: scale(0.97); }
        .option-btn.correct { background: #2ed573 !important; }
        .option-btn.wrong { background: #ff4757 !important; }
        .result-screen { display: none; }
        .restart-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 تحدي درس "من أنا؟" 🌟</h1>
        <div class="score-box" id="scoreDisplay">النقاط: 0 ⭐</div>

        <!-- شاشة اللعبة -->
        <div id="gameScreen">
            <div class="question-box" id="questionText">جاري تحميل السؤال...</div>
            <div id="optionsContainer"></div>
        </div>

        <!-- شاشة النهاية (الفوز) -->
        <div class="result-screen" id="resultScreen">
            <h2>🏆 بطلة عظيمة! 🏆</h2>
            <p id="finalMessage" style="font-size: 18px; font-weight: bold;"></p>
            <button class="restart-btn" onclick="restartGame()">العب تاني 🔄</button>
        </div>
    </div>

    <script>
        // الأسئلة مبنية بالظبط من صفحات الدرس والتدريبات اللي صورتها (آبلة فضيلة ومعاني الكلمات)
        const questions = [
            {
                q: "في درس (من أنا؟)، من هي الشخصية الإذاعية الشهيرة التي تحكي الحكايات للأطفال؟",
                options: ["آبلة فضيلة", "أبلة ميرفت", "عزة ودور"],
                correct: 0,
                sound: "مين الشخصية الإذاعية الشهيرة في الدرس؟ هل هي آبلة فضيلة؟"
            },
            {
                q: "ما معنى كلمة (شهير) في جملة: (دكتور أحمد زويل شهير بأبحاثه)؟",
                options: ["فقير", "معروف", "صغير"],
                correct: 1,
                sound: "ما معنى كلمة شهير؟"
            },
            {
                q: "ما هو حلم (آبلة فضيلة) الحقيقي بعد أن التحقت بكلية الحقوق؟",
                options: ["أن تكون طبيبة", "أن تكون مهندسة", "أن تكون مذيعة في الإذاعة المصرية"],
                correct: 2,
                sound: "إيه كان حلم آبلة فضيلة الحقيقي؟"
            },
            {
                q: "ما معنى كلمة (أواجه) في جملة: (أواجه المشكلات بإرادة قوية)؟",
                options: ["أقابل", "أهرب من", "أترك"],
                correct: 0,
                sound: "ما معنى كلمة أواجه؟"
            },
            {
                q: "من خلال التدريبات، ما هي كلمة مرادفها (الإشارات)؟",
                options: ["القصص", "التلميحات", "الحكايات"],
                correct: 1,
                sound: "ما هي الكلمة التي مرادفها الإشارات؟"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResult();
                return;
            }

            const qData = questions[currentQuestion];
            document.getElementById('questionText').innerText = `السؤال (${currentQuestion + 1} من ${questions.length}):\n` + qData.q;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            speak(qData.sound);
        }

        function checkAnswer(selectedIdx, btnElement) {
            const qData = questions[currentQuestion];
            const allButtons = document.querySelectorAll('.option-btn');
            
            // قفل الأزرار عشان ميتدش كذا مرة
            allButtons.forEach(b => b.disabled = true);

            if (selectedIdx === qData.correct) {
                btnElement.classList.add('correct');
                score += 10;
                document.getElementById('scoreDisplay').innerText = `النقاط: ${score} ⭐`;
                speak("برافو عليكِ يا بطلة، إجابة صحيحة وممتازة!");
            } else {
                btnElement.classList.add('wrong');
                allButtons[qData.correct].classList.add('correct');
                speak("معليش يا شطورة، الإجابة الصحيحة هي دي.");
            }

            currentQuestion++;
            setTimeout(loadQuestion, 2000); // الانتقال للسؤال التالي بعد ثانيتين
        }

        function showResult() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('finalMessage').innerText = `خلصتِ اللعبة يا بطلة! وجبتِ ${score} نقطة من 50. شطورة خالص! 🎉`;
            speak(`خلصتِ اللعبة يا بطلة! جبتِ ${score} نقطة. برافو عليكِ!`);
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('scoreDisplay').innerText = `النقاط: 0 ⭐`;
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            loadQuestion();
        }

        // بدء اللعبة أول ما الصفحة تفتح
        window.onload = () => {
            setTimeout(loadQuestion, 1000);
        };
    </script>

</body>
</html>
