<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التعليم التفاعلية 🎮✨</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        h1 { color: #0984e3; font-size: 24px; margin-bottom: 5px; }
        .score-box {
            background: #00b894;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-box {
            background: #dfe6e9;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3436;
            text-align: right;
        }
        .option-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: right;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .option-btn:active { transform: scale(0.97); }
        .option-btn.correct { background: #00b894 !important; }
        .option-btn.wrong { background: #d63031 !important; }
        .result-screen { display: none; }
        .restart-btn {
            background: #e17055;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 التحدي التعليمي الذكي 🌟</h1>
        <div class="score-box" id="scoreDisplay">النقاط: 0 ⭐</div>

        <!-- شاشة اللعبة -->
        <div id="gameScreen">
            <div class="question-box" id="questionText">ارفع صور الدرس أو اسألني لأجهز لك اللعبة!</div>
            <div id="optionsContainer"></div>
        </div>

        <!-- شاشة النهاية -->
        <div class="result-screen" id="resultScreen">
            <h2>🏆 بطل ممتاز! 🏆</h2>
            <p id="finalMessage" style="font-size: 18px; font-weight: bold;"></p>
            <button class="restart-btn" onclick="restartGame()">العب تاني 🔄</button>
        </div>
    </div>

    <script>
        // الأسئلة قابلة للتعديل بحسب الدرس أو الصور التي ترفعها في أي وقت
        const questions = [
            {
                q: "السؤال الأول: ما هي عاصمة جمهورية مصر العربية؟",
                options: [
                    "الاجابة الأولى: الإسكندرية", 
                    "الاجابة الثانية: القاهرة", 
                    "الاجابة الثالثة: أسوان", 
                    "الاجابة الرابعة: الأقصر"
                ],
                correct: 1,
                sound: "السؤال الأول: ما هي عاصمة جمهورية مصر العربية؟ الاختيارات: الإجابة الأولى: الإسكندرية. الإجابة الثانية: القاهرة. الإجابة الثالثة: أسوان. الإجابة الرابعة: الأقصر."
            },
            {
                q: "السؤال الثاني: أي من المواد الدراסيّة التالية تهتم بدراسة الخرائط والبلدان؟",
                options: [
                    "الاجابة الأولى: العلوم", 
                    "الاجابة الثانية: الرياضيات", 
                    "الاجابة الثالثة: الدراسات الاجتماعية", 
                    "الاجابة الرابعة: اللغة العربية"
                ],
                correct: 2,
                sound: "السؤال الثاني: أي من المواد الدراسية التالية تهتم بدراسة الخرائط والبلدان؟ الاختيارات: الإجابة الأولى: العلوم. الإجابة الثانية: الرياضيات. الإجابة الثالثة: الدراسات الاجتماعية. الإجابة الرابعة: اللغة العربية."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.90; // سرعة هادئة وواضحة للطفل
            window.speechSynthesis.speak(utterance);
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResult();
                return;
            }

            const qData = questions[currentQuestion];
            document.getElementById('questionText').innerText = qData.q;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            // قراءة السؤال كاملًا ثم الخيارات بالترتيب من واحد لأربعة
            speak(qData.sound);
        }

        function checkAnswer(selectedIdx, btnElement) {
            const qData = questions[currentQuestion];
            const allButtons = document.querySelectorAll('.option-btn');
            
            allButtons.forEach(b => b.disabled = true);

            if (selectedIdx === qData.correct) {
                btnElement.classList.add('correct');
                score += 10;
                document.getElementById('scoreDisplay').innerText = `النقاط: ${score} ⭐`;
                speak("برافو! إجابة صحيحة وممتازة.");
            } else {
                btnElement.classList.add('wrong');
                allButtons[qData.correct].classList.add('correct');
                speak("معليش، الإجابة الصحيحة هي: " + qData.options[qData.correct]);
            }

            currentQuestion++;
            setTimeout(loadQuestion, 3000);
        }

        function showResult() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('finalMessage').innerText = `أنهيت التحدي بنجاح! مجموع نقاطك: ${score} نقطة. ممتاز جداً! 🎉`;
            speak(`أنهيت التحدي بنجاح! مجموع نقاطك هو ${score} نقطة. برافو عليك!`);
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('scoreDisplay').innerText = `النقاط: 0 ⭐`;
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            loadQuestion();
        }

        window.onload = () => {
            setTimeout(loadQuestion, 1000);
        };
    </script>

</body>
</html>
